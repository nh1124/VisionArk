services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: atmos-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atmos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atmos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-atmos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atmos}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atmos-network
    restart: unless-stopped
    env_file:
      - ../.env

  # Backend API
  backend:
    build:
      context: ../core/backend
      dockerfile: Dockerfile
    container_name: atmos-backend
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-atmos}:${POSTGRES_PASSWORD:-atmos_secret}@db:5432/${POSTGRES_DB:-atmos}
      - ATMOS_ENV=${ATMOS_ENV:-dev}
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ATMOS_SERVICE_KEY=${ATMOS_SERVICE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${VA_HOST_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../core/backend:/app
      - ../va_sdk:/app/va_sdk
      - ../integrations:/app/integrations
      - ../data:/app/data # Full data directory (spokes, hub_data, users, etc.)
      - ../assets:/app/assets
    networks:
      - atmos-network
    restart: unless-stopped
    env_file:
      - ../.env

  # Background Worker
  worker:
    build:
      context: ../core/backend
      dockerfile: Dockerfile
    container_name: atmos-worker
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-atmos}:${POSTGRES_PASSWORD:-atmos_secret}@db:5432/${POSTGRES_DB:-atmos}
      - ATMOS_ENV=${ATMOS_ENV:-dev}
      - HOST=0.0.0.0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ATMOS_SERVICE_KEY=${ATMOS_SERVICE_KEY}
    volumes:
      - ../core/backend:/app
      - ../va_sdk:/app/va_sdk
      - ../integrations:/app/integrations
      - ../data:/app/data
      - ../assets:/app/assets
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - atmos-network
    restart: unless-stopped
    command: python -m app.worker
    env_file:
      - ../.env

  # Frontend UI
  frontend:
    build:
      context: ../core/frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    container_name: atmos-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "${VA_HOST_FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - ../core/frontend:/app
      - /app/node_modules
      - ../assets/static:/app/public/assets
    command: npm run dev -- -H 0.0.0.0
    depends_on:
      - backend
    networks:
      - atmos-network
    restart: unless-stopped
    env_file:
      - ../.env

  # Redis Queue
  redis:
    image: redis:alpine
    container_name: visionark-redis
    restart: always
    ports: [ "6379:6379" ]
    networks:
      - atmos-network

  # Cloudflare Tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: atmos-tunnel
    # Cloudflared will automatically use the TUNNEL_TOKEN environment variable provided by env_file
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    networks:
      - atmos-network
    env_file:
      - ../.env

networks:
  atmos-network:
    driver: bridge

volumes:
  postgres_data:
