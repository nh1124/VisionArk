[package]
name = "visionark-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "visionark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "visionark-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.0.0-rc.0"
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "3.6.3" } # Note: Android requires a custom Tauri plugin (e.g. tauri-plugin-stronghold) for true secure storage. Memory mock is used as fallback.
