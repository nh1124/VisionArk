graph_name: project_assistant
start: plan
steps:
  - id: plan
    type: role
    role: planner
    skills: []
    limits:
      max_turns: 10
      max_output_tokens: 1024
    on:
      - when: "event.type == 'done'"
        next: execute
      - when: default
        next: plan
  - id: execute
    type: role
    role: project
    skills: []
    limits:
      max_turns: 25
      max_tool_calls: 50
      max_output_tokens: 4096
    on:
      - when: "event.type == 'done'"
        next: verify
      - when: default
        next: execute
  - id: verify
    type: role
    role: verifier
    skills: []
    limits:
      max_turns: 5
      max_tool_calls: 10
      max_output_tokens: 2048
    on:
      - when: "event.type == 'done'"
        next: respond
      - when: default
        next: verify
  - id: respond
    type: role
    role: responder
    skills: []
    terminal: true
